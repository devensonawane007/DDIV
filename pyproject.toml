[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ddiv"
version = "0.1.0"
description = "DDIV: Detect -> Diagnose -> Intervene -> Verify Multi-Agent Code Repair Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "openai>=1.12.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "models*", "core*", "memory*", "recovery*", "evaluation*", "logging_system*", "scripts*"]
